<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" role="img" aria-labelledby="title desc">
  <title id="title">Lablink core architecture</title>
  <desc id="desc">The Java core library. An application uses LlClient. Services, datapoints, and synchronization share one connection. Payloads are encoded as JSON and sent over MQTT. The interactive shell and resource discovery belong to the client.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1c1c1c"/>
    </marker>
    <style>
      .ink { fill: #1c1c1c; }
      .muted { fill: #3d3d3d; }
      .paper { fill: #ffffff; stroke: #1c1c1c; stroke-width: 1.25; }
      .frame { fill: #f4f6f8; stroke: #1c1c1c; stroke-width: 1.25; }
      .outside { fill: #ffffff; stroke: #1c1c1c; stroke-width: 1.25; stroke-dasharray: 5 3; }
      .band { fill: #1b3a4b; }
      .title { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 650; fill: #1c1c1c; }
      .title-inv { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 650; fill: #ffffff; }
      .sub { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #3d3d3d; }
      .sub-inv { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #d5e2ea; }
      .wire { fill: none; stroke: #1c1c1c; stroke-width: 1.25; }
    </style>
  </defs>

  <!-- Application, outside the library -->
  <rect class="outside" x="250" y="8" width="400" height="52"/>
  <text class="title" x="450" y="30" text-anchor="middle">Application</text>
  <text class="sub" x="450" y="48" text-anchor="middle">user code</text>

  <!-- Library boundary -->
  <rect class="frame" x="20" y="82" width="860" height="486"/>
  <rect class="band" x="20" y="82" width="860" height="32"/>
  <text class="title-inv" x="36" y="103">Lablink core</text>
  <text class="sub-inv" x="864" y="103" text-anchor="end">at.ac.ait.lablink.core</text>
  <line class="wire" x1="450" y1="60" x2="450" y2="82" marker-end="url(#arrow)"/>

  <!-- Client and the two facilities that stay off the value path -->
  <rect class="paper" x="36" y="128" width="448" height="66"/>
  <text class="title" x="52" y="154">LlClient</text>
  <text class="sub" x="52" y="174">name, lifecycle, properties, registered services</text>

  <rect class="paper" x="500" y="128" width="176" height="66"/>
  <text class="title" x="588" y="154" text-anchor="middle">Interactive shell</text>
  <text class="sub" x="588" y="174" text-anchor="middle">LlClientIShell</text>

  <rect class="paper" x="692" y="128" width="172" height="66"/>
  <text class="title" x="778" y="154" text-anchor="middle">Resource discovery</text>
  <text class="sub" x="778" y="174" text-anchor="middle">UDP multicast</text>

  <!-- Value path from the client into services, datapoints, and sync -->
  <line class="wire" x1="260" y1="194" x2="260" y2="214"/>
  <line class="wire" x1="164" y1="214" x2="736" y2="214"/>
  <line class="wire" x1="164" y1="214" x2="164" y2="230" marker-end="url(#arrow)"/>
  <line class="wire" x1="450" y1="214" x2="450" y2="230" marker-end="url(#arrow)"/>
  <line class="wire" x1="736" y1="214" x2="736" y2="230" marker-end="url(#arrow)"/>

  <rect class="paper" x="36" y="230" width="256" height="78"/>
  <text class="title" x="164" y="258" text-anchor="middle">Services</text>
  <text class="sub" x="164" y="278" text-anchor="middle">typed LlService values</text>
  <text class="sub" x="164" y="294" text-anchor="middle">six datatypes</text>

  <rect class="paper" x="322" y="230" width="256" height="78"/>
  <text class="title" x="450" y="258" text-anchor="middle">Datapoints</text>
  <text class="sub" x="450" y="278" text-anchor="middle">host and consumer</text>
  <text class="sub" x="450" y="294" text-anchor="middle">value and timestamp</text>

  <rect class="paper" x="608" y="230" width="256" height="78"/>
  <text class="title" x="736" y="258" text-anchor="middle">Synchronization</text>
  <text class="sub" x="736" y="278" text-anchor="middle">sync host and consumer</text>
  <text class="sub" x="736" y="294" text-anchor="middle">init, go, stop</text>

  <line class="wire" x1="164" y1="308" x2="164" y2="324"/>
  <line class="wire" x1="450" y1="308" x2="450" y2="324"/>
  <line class="wire" x1="736" y1="308" x2="736" y2="324"/>
  <line class="wire" x1="164" y1="324" x2="736" y2="324"/>
  <line class="wire" x1="450" y1="324" x2="450" y2="340" marker-end="url(#arrow)"/>

  <!-- Connection -->
  <rect class="paper" x="36" y="340" width="828" height="100"/>
  <text class="title" x="52" y="362">Connection</text>
  <text class="sub" x="848" y="362" text-anchor="end">shared publishing, topics</text>

  <rect class="paper" x="52" y="376" width="390" height="50"/>
  <text class="title" x="247" y="396" text-anchor="middle">Messaging</text>
  <text class="sub" x="247" y="414" text-anchor="middle">publish and subscribe</text>

  <rect class="paper" x="458" y="376" width="390" height="50"/>
  <text class="title" x="653" y="396" text-anchor="middle">Remote calls</text>
  <text class="sub" x="653" y="414" text-anchor="middle">request and reply</text>

  <line class="wire" x1="450" y1="440" x2="450" y2="456" marker-end="url(#arrow)"/>

  <rect class="paper" x="36" y="456" width="828" height="40"/>
  <text class="title" x="52" y="481">JSON encoding</text>
  <text class="sub" x="188" y="481">JsonEncoder, JsonDecoder</text>

  <line class="wire" x1="450" y1="496" x2="450" y2="512" marker-end="url(#arrow)"/>

  <rect class="paper" x="36" y="512" width="828" height="40"/>
  <text class="title" x="52" y="537">MQTT transport</text>
  <text class="sub" x="196" y="537">replaceable low-level client, yellow pages</text>

  <!-- Broker, outside the library -->
  <line class="wire" x1="450" y1="552" x2="450" y2="584" marker-end="url(#arrow)"/>
  <rect class="outside" x="250" y="584" width="400" height="52"/>
  <text class="title" x="450" y="606" text-anchor="middle">MQTT broker</text>
  <text class="sub" x="450" y="624" text-anchor="middle">other Lablink clients</text>
</svg>
