<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Messaging</title>
  <desc id="desc">A sender publishes one payload on a subject. Two receivers handle that payload later. Nothing is returned to the sender.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1c1c1c"/>
    </marker>
    <style>
      .paper { fill: #ffffff; stroke: #1c1c1c; stroke-width: 1.25; }
      .frame { fill: #f4f6f8; stroke: #1c1c1c; stroke-width: 1.25; }
      .title { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 650; fill: #1c1c1c; }
      .sub { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #3d3d3d; }
      .wire { fill: none; stroke: #1c1c1c; stroke-width: 1.25; }
    </style>
  </defs>

  <rect class="frame" x="16" y="8" width="828" height="344"/>

  <rect class="paper" x="310" y="28" width="240" height="64"/>
  <text class="title" x="430" y="54" text-anchor="middle">Sender</text>
  <text class="sub" x="430" y="74" text-anchor="middle">publishMessage returns</text>

  <line class="wire" x1="430" y1="92" x2="430" y2="124" marker-end="url(#arrow)"/>
  <text class="sub" x="442" y="112">one way</text>

  <rect class="paper" x="310" y="128" width="240" height="64"/>
  <text class="title" x="430" y="154" text-anchor="middle">Subject</text>
  <text class="sub" x="430" y="174" text-anchor="middle">Status, Update</text>

  <line class="wire" x1="430" y1="192" x2="430" y2="220"/>
  <line class="wire" x1="200" y1="220" x2="660" y2="220"/>
  <line class="wire" x1="200" y1="220" x2="200" y2="248" marker-end="url(#arrow)"/>
  <line class="wire" x1="660" y1="220" x2="660" y2="248" marker-end="url(#arrow)"/>

  <rect class="paper" x="80" y="252" width="240" height="72"/>
  <text class="title" x="200" y="280" text-anchor="middle">Receiver A</text>
  <text class="sub" x="200" y="300" text-anchor="middle">handleMessage</text>

  <rect class="paper" x="540" y="252" width="240" height="72"/>
  <text class="title" x="660" y="280" text-anchor="middle">Receiver B</text>
  <text class="sub" x="660" y="300" text-anchor="middle">handleMessage</text>
</svg>
